name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: Existing tag to build and validate
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native-tests:
    name: Native tests and verified package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: automation
          persist-credentials: false
      - name: Check out product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test automation and release guards
        working-directory: automation
        run: python -m unittest discover -s tests/sandbox -v
      - name: Validate release source
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python automation/scripts/ci_prepare_release.py
      - name: Start pinned NetBox sandbox
        run: make setup
      - name: Run helpers and live runtime, authentication and static checks
        run: make test
      - name: Build and test installed distributions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release_check.py --dist-dir dist --release-tag "$RELEASE_TAG"
          else
            python scripts/release_check.py --dist-dir dist
          fi
      - name: Check PyPI metadata
        run: |
          python -m pip install 'twine>=6,<7'
          python -m twine check --strict dist/*
      - name: Record artifact checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-distributions
          path: |
            source/dist/*
            source/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Show redacted diagnostics on failure
        if: failure()
        run: python scripts/sandbox.py compose logs --tail 80
      - name: Stop disposable sandbox
        if: always()
        run: python scripts/sandbox.py compose down --volumes
